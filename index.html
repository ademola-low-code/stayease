<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StayEase — Your Room, One Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--s1:#FFFFFF;--s2:#F1EFE8;--line:rgba(31,59,51,.12);--line2:rgba(31,59,51,.28);--gold:#1F3B33;--pale:#1F3B33;--tx:#1B1F1D;--mu:#6B6F6A;--live:#3FAE84;--mint:#D7F0E3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.55 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible{outline:1px solid var(--pale);outline-offset:3px}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 24px 120px;position:relative;overflow:hidden}
.app::before{content:"";position:absolute;left:-20%;right:-20%;top:-120px;height:460px;background:radial-gradient(closest-side,rgba(215,240,227,.9),transparent);pointer-events:none}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:22px 0 8px}
.brand{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;letter-spacing:.01em}
.room{font-size:13px;color:var(--pale);background:var(--mint);border:1px solid #BFE6D2;border-radius:99px;padding:5px 14px}
.view{display:none;position:relative}.view.on{display:block}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(46px,14vw,62px);line-height:.98;letter-spacing:-.015em;margin:46px 0 18px}
h1 span{display:block;overflow:hidden}
h1 span i{display:block;font-style:italic;color:var(--pale);animation:rise 1.1s cubic-bezier(.2,.7,.1,1) both}
h1 span:nth-child(2) i{animation-delay:.18s}h1 span:nth-child(3) i{animation-delay:.36s}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.lede{color:var(--mu);max-width:30ch;margin:0 0 40px}
.sec{font-family:"Cormorant Garamond",serif;font-size:20px;font-style:italic;color:var(--gold);margin:0 0 4px}
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:20px 0;border-bottom:1px solid var(--line);transition:padding .25s,background .25s}
.row:active,.row:hover{padding-left:8px}
.ic{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold)}
.ic svg{width:22px;height:22px}
.row b{display:block;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:24px;line-height:1.1}
.row small{color:var(--mu);font-size:14px}
.row .ch{margin-left:auto;width:16px;height:16px;color:var(--line2);flex:none}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;transform:translateY(100%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.7,.1,1),visibility 0s .5s;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px calc(env(safe-area-inset-bottom,0px) + 28px)}
.sheet.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.in{max-width:480px;margin:0 auto}
.back{color:var(--mu);font-size:15px;padding:10px 0;display:inline-flex;gap:6px;align-items:center}
.back svg{width:16px;height:16px}
.sheet h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:44px;line-height:1;margin:18px 0 6px}
.sheet p.sub{color:var(--mu);margin:0 0 30px}
.lab{font-size:14px;color:var(--pale);margin:26px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line2);border-radius:99px;padding:9px 18px;font-size:15px;color:var(--tx);transition:.2s}
.chip.on{background:var(--gold);border-color:var(--gold);color:#F7F5F0;font-weight:400}
textarea{width:100%;min-height:96px;background:var(--s1);border:1px solid var(--line);border-radius:14px;color:var(--tx);font:500 16px/1.5 Jost,sans-serif;padding:14px 16px;resize:none}
textarea::placeholder{color:#9a9e98}
.cta{width:100%;margin-top:30px;background:#1F3B33;color:#F7F5F0;font-weight:500;font-size:17px;padding:17px;border-radius:99px;box-shadow:0 10px 30px -10px rgba(31,59,51,.45)}
.ghost{width:100%;margin-top:14px;border:1px solid var(--line2);color:var(--pale);padding:15px;border-radius:99px}
.done{text-align:center;padding-top:70px}
.done svg{width:92px;height:92px;color:var(--gold);filter:drop-shadow(0 0 14px rgba(63,174,132,.5))}
.done circle,.done path{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.1s .1s ease forwards}
.done path{animation-delay:.7s;stroke-dasharray:40;stroke-dashoffset:40;animation-duration:.5s}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{margin-top:26px}
.ref{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:6px 16px;color:var(--pale);margin:6px 0 24px;font-size:14px}
.card{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:22px;padding:26px 24px;margin-top:30px}
.card h3{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:32px;line-height:1.05;margin:0 0 4px}
.card .meta{color:var(--mu);font-size:14px;margin:0 0 28px}
.tl{padding-left:34px}
.st{position:relative;padding-bottom:28px}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:-27px;top:20px;bottom:-4px;width:1px;background:var(--line2)}
.st:last-child::before{display:none}
.st.done::before{background:var(--gold);box-shadow:0 0 8px rgba(63,174,132,.5)}
.dot{position:absolute;left:-34px;top:5px;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);background:var(--bg)}
.st.done .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px 1px rgba(63,174,132,.7)}
.st.cur .dot{background:var(--live);border-color:var(--live);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 8px 1px rgba(63,174,132,.7),0 0 0 0 rgba(63,174,132,.4)}50%{box-shadow:0 0 22px 5px rgba(63,174,132,.9),0 0 0 9px rgba(63,174,132,0)}}
.st b{font-weight:400;font-size:17px;display:block}
.st small{color:var(--mu);font-size:14px}
.st:not(.done):not(.cur) b{color:#9a9e98}
.empty{text-align:center;color:var(--mu);padding:70px 10px}
.empty h3{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:32px;color:var(--tx);margin:0 0 6px}
.h{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.h b{display:block;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:23px;line-height:1.1}
.h small{color:var(--mu);font-size:14px}
.badge{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--pale);white-space:nowrap}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px rgba(63,174,132,.6)}
.badge.live i{background:var(--live);animation:glow 2.2s ease-in-out infinite}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(247,245,240,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--mu);padding:6px 0;transition:color .2s}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--gold)}
.brand,h1,.row b,.sheet h2,.card h3,.empty h3,.h b{font-weight:700}
.sec{font-weight:600}
.st b{font-weight:600}
.chip.on{font-weight:500}
.cta{font-weight:600}
.lede{max-width:34ch;margin:0 0 28px}
.hero{font-size:clamp(42px,12.5vw,58px);margin:20px 0 16px}
.hero i.u{font-style:normal;color:var(--tx)}
.pillm{display:inline-flex;align-items:center;gap:10px;background:var(--mint);border:1px solid #BFE6D2;border-radius:99px;padding:8px 18px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:30px}
.pillm i{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 8px rgba(63,174,132,.8)}
.scan{width:auto;display:inline-flex;align-items:center;gap:12px;padding:16px 30px;margin-top:0}
.scan svg{width:22px;height:22px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:26px 14px;margin:38px 0 40px}
.f{display:flex;gap:12px;align-items:flex-start}
.f .ic{width:42px;height:42px;background:var(--s1)}
.f .ic svg{width:20px;height:20px}
.f b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.f small{color:var(--mu);font-size:13px}
.hiw{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -24px 0;padding:4px 24px 8px;scrollbar-width:none}
.hiw::-webkit-scrollbar{display:none}
.hc{flex:0 0 min(76%,300px);scroll-snap-align:start;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:6px}
.hc .n{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#F7F5F0;display:grid;place-items:center;font:700 20px "Cormorant Garamond",serif;margin-bottom:10px}
.hc b{font:700 24px/1.1 "Cormorant Garamond",serif}
.hc small{color:var(--mu);font-size:15px}
#code{width:100%;text-align:center;font:700 44px "Cormorant Garamond",serif;letter-spacing:.35em;padding:14px 0 14px .35em;text-transform:uppercase;background:var(--s1);border:1px solid var(--line2);border-radius:16px;color:var(--tx)}
.err{color:#a3402f;min-height:24px;margin:10px 0 0;font-size:14px;font-weight:600}
.hint{text-align:center;color:var(--mu);font-size:13px;margin-top:14px}
.cxbtn{margin-top:22px;border-color:#d9b9b1;color:#a3402f}
.cxnote{color:var(--mu);font-size:14px;text-align:center;margin:18px 0 0}
.badge.cx{color:var(--mu)}
.badge.cx i{background:#b9b6ad;box-shadow:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">StayEase</div><div class="room">Room 412</div></header>

  <section class="view on" id="v-home">
    <span class="pillm"><i></i>Scan. Request. Relax.</span>
    <h1 class="hero"><span><i class="u">Your stay,</i></span><span><i>just a scan away</i></span></h1>
    <p class="lede">From extra towels to room service, get what you need instantly. No calls, no waiting.</p>
    <button class="cta scan" id="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></svg><span>Scan a QR code</span></button>
    <div class="feat" id="feat"></div>
    <p class="sec">How it works</p>
    <div class="hiw" id="hiw"></div>
  </section>

  <section class="view" id="v-svc">
    <span class="pillm" style="margin-top:26px"><i></i>Room 412 detected</span>
    <h1 class="hero"><span><i class="u">How can we</i></span><span><i>help today?</i></span></h1>
    
    <div class="list" id="grid"></div>
  </section>

  <section class="view" id="v-track"></section>
  <section class="view" id="v-hist"></section>
</div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<nav>
  <button data-t="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-t="svc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M5 20h14"/></svg>Services</button>
  <button data-t="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></svg>Track</button>
  <button data-t="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4M12 8v4.5l3 1.5"/></svg>History</button>
</nav>

<script>
const I={
bed:'<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.6"/>',
dine:'<path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 8V6M10.5 6h3"/>',
shirt:'<path d="M8 4L3 7l2 4 2-1v10h10V10l2 1 2-4-5-3a4 4 0 0 1-8 0z"/>',
tool:'<path d="M15 5a4 4 0 0 0-4 5l-7 7a2 2 0 0 0 3 3l7-7a4 4 0 0 0 5-4l-3 2-2-2 2-3z"/>',
spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 16v4M16 18h4"/>',
key:'<circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M17 12v3M20 12v2"/>'};
const svg=(k,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.2}" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const S=[
{n:"Housekeeping",d:"Refresh and tidy your room",i:"bed",o:["Full clean","Turn-down service","Fresh linens","Make up room"]},
{n:"Room dining",d:"Delivered to your door",i:"dine",o:["Breakfast","Light bites","Beverages","Dinner"]},
{n:"Laundry",d:"Washed, pressed and returned",i:"shirt",o:["Wash and fold","Dry cleaning","Press only","Express"]},
{n:"Maintenance",d:"We’ll make it right",i:"tool",o:["Air conditioning","Lighting","Plumbing","TV or Wi-Fi"]},
{n:"Amenities",d:"Towels, pillows and more",i:"spark",o:["Extra towels","Pillows","Toiletries","Slippers"]},
{n:"Concierge",d:"Cars, tables and late checkout",i:"key",o:["Airport transfer","Book a table","Local tour","Late checkout"]}];
const STEPS=[["Received","We have your request"],["Assigned","A team member is on it"],["On the way","Heading to your room"],["Completed","All done. Enjoy your stay"]];
const WHEN=[["As soon as possible","10 minutes"],["In 30 minutes","30 minutes"],["In 1 hour","1 hour"],["This evening","this evening"]];
let reqs=[{ref:"SE-2041",svc:"Amenities",opts:["Extra towels"],when:"Yesterday",step:3},{ref:"SE-2033",svc:"Room dining",opts:["Breakfast"],when:"Yesterday",step:3}];
let cur=null,pick=[],tm=0,n=0;
let ok=false,bad=0;const CODE="T3Y6";
let cxr=null,cxw="Changed my mind";
function cancelSheet(ref){
  cxr=reqs.find(x=>x.ref===ref);cxw="Changed my mind";
  openSheet(`<button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
  <h2>Cancel request</h2><p class="sub">${cxr.svc}: ${cxr.opts.join(", ")}</p>
  <div class="lab">Why are you cancelling?</div>
  <div class="chips" id="why">${["Changed my mind","Sent by mistake","Duplicate request","Other"].map((w,i)=>`<button class="chip${i?"":" on"}" data-w2="${w}">${w}</button>`).join("")}</div>
  <button class="cta" id="cxgo" style="background:#a3402f;box-shadow:none;color:#F7F5F0">Confirm cancellation</button>
  <button class="ghost" id="cxkeep" style="width:100%;margin-top:12px;padding:15px">Keep my request</button>`);
}
function doCancel(){
  cxr.step=3;cxr.c=true;cxr.reason=cxw;renderTrack();renderHist();
  openSheet(`<div class="done"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="44"/><path d="M36 36l28 28"/><path d="M64 36l-28 28"/></svg><h2>Request cancelled</h2><div class="ref">${cxr.ref}</div><p class="sub">Your request was cancelled. It stays in your history.</p><button class="cta" id="cl">Done</button></div>`);
}
function codeSheet(){
  openSheet(`<button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
  <h2>Enter your code</h2><p class="sub">Room 412 detected. Type the 4-character code from your check-in card.</p>
  <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Check-in code">
  <p class="err" id="cerr"></p>
  <button class="cta" id="unlock">Unlock my room</button>
  <p class="hint">Demo code: T3Y6</p>`);
  setTimeout(()=>document.querySelector("#code").focus(),500);
}
function unlock(){
  const i=document.querySelector("#code"),e=document.querySelector("#cerr");
  if(bad>=3){e.textContent="Too many tries. Please ask reception.";return}
  if(i.value.trim().toUpperCase()===CODE){ok=true;closeSheet();tab("svc");return}
  bad++;i.value="";
  e.textContent=bad>=3?"Too many tries. Please ask reception.":"That code isn’t right. "+(3-bad)+" tries left.";
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="code")unlock()});
Object.assign(I,{bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',timer:'<circle cx="12" cy="13.5" r="7"/><path d="M12 10v4l2 1.5M10 3h4"/>',phone:'<path d="M5 4l3-1 2 5-2 1.5a11 11 0 0 0 5 5L14.5 13l5 2-1 3a2 2 0 0 1-2 1.5A14 14 0 0 1 3.5 6 2 2 0 0 1 5 4z"/><path d="M3 3l18 18"/>',scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/>'});
const FT=[["bolt","Fast and easy requests","2 taps to submit"],["timer","Real-time updates","Live tracking"],["phone","Fewer calls to reception","No hold music"],["spark","Smoother stay","Hotel-grade care"]];
document.querySelector("#feat").innerHTML=FT.map(f=>`<div class="f"><span class="ic">${svg(f[0])}</span><span><b>${f[1]}</b><small>${f[2]}</small></span></div>`).join("");
const HW=[["scan","Scan the QR","Find the code in your room and scan it. Your room is detected."],["key","Choose and send","Pick what you need, add a note and send."],["timer","Track it live","Watch your request move from Received to Completed."]];
document.querySelector("#hiw").innerHTML=HW.map((h,i)=>`<div class="hc"><span class="n">${i+1}</span><b>${h[1]}</b><small>${h[2]}</small></div>`).join("");
const $=s=>document.querySelector(s);

$("#grid").innerHTML=S.map((s,i)=>`<button class="row" data-i="${i}"><span class="ic">${svg(s.i)}</span><span><b>${s.n}</b><small>${s.d}</small></span><svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>`).join("");

function tab(t){
  if(t!=="home"&&!ok)t="home";
  ["home","svc","track","hist"].forEach(v=>$("#v-"+v).classList.toggle("on",v===t));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  window.scrollTo(0,0);
}
function openSheet(html){$("#sheetIn").innerHTML=html;$("#sheet").classList.add("open");$("#sheet").scrollTop=0}
function closeSheet(){$("#sheet").classList.remove("open")}

function form(i){
  cur=S[i];pick=[];tm=0;
  openSheet(`<button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
  <h2>${cur.n}</h2><p class="sub">${cur.d}</p>
  <div class="lab">What do you need?</div>
  <div class="chips" id="opts">${cur.o.map(o=>`<button class="chip" data-o="${o}">${o}</button>`).join("")}</div>
  <div class="lab">When?</div>
  <div class="chips" id="when">${WHEN.map((w,k)=>`<button class="chip${k?"":" on"}" data-w="${k}">${w[0]}</button>`).join("")}</div>
  <div class="lab">Anything else we should know?</div>
  <textarea id="note" placeholder="Optional note for our team"></textarea>
  <button class="cta" id="go">Send request</button>`);
}

function submit(){
  const r={ref:"SE-"+(2100+n++),svc:cur.n,opts:pick.length?pick.slice():[cur.n],note:$("#note").value.trim(),when:"Today",eta:WHEN[tm][1],step:0};
  reqs.unshift(r);
  renderTrack();renderHist();
  openSheet(`<div class="done"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="44"/><path d="M32 51l12 12 24-26"/></svg>
  <h2>Request sent</h2><div class="ref">${r.ref}</div>
  <p class="sub">Our team has it. You can follow the progress live.</p>
  <button class="cta" id="seeT">Track request</button><button class="ghost" id="cl">Done</button></div>`);
}

function renderTrack(){
  const r=reqs.find(x=>x.step<3);
  $("#v-track").innerHTML=r?`<div class="card"><h3>${r.svc}</h3><p class="meta">${r.opts.join(", ")}<br>${r.step<3?"Expected in about "+r.eta:""}</p>
  <div class="tl">${STEPS.map((s,k)=>`<div class="st ${k<r.step?"done":k===r.step?"cur":""}"><span class="dot"></span><b>${s[0]}</b><small>${s[1]}</small></div>`).join("")}</div></div>
  ${r.step<2?`<button class="ghost cxbtn" data-cx="${r.ref}">Cancel request</button>`:`<p class="cxnote">On the way. To cancel, please contact reception.</p>`}
  <button class="ghost" data-t="svc" style="margin-top:12px">New request</button>`
  :`<div class="empty"><h3>Nothing in progress</h3><p>When you send a request, you’ll follow it here.</p><button class="ghost" data-t="svc">Browse services</button></div>`;
}
function renderHist(){
  $("#v-hist").innerHTML=`<h1 style="font-size:44px;margin:34px 0 18px"><span><i style="animation:none">Past requests</i></span></h1><div class="list">`+reqs.map(r=>`<div class="h"><div><b>${r.svc}</b><small>${r.opts.join(", ")}, ${r.when}</small></div><div class="badge${r.step<3?" live":r.c?" cx":""}"><i></i>${r.c?"Cancelled":STEPS[r.step][0]}</div></div>`).join("")+`</div>`;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("row"))form(+t.dataset.i);
  else if(t.dataset.t){closeSheet();tab(t.dataset.t)}
  else if(t.id==="bk"||t.id==="cl")closeSheet();
  else if(t.id==="seeT"){closeSheet();tab("track")}
  else if(t.id==="go")submit();
  else if(t.id==="unlock")unlock();
  else if(t.dataset.cx)cancelSheet(t.dataset.cx);
  else if(t.dataset.w2){cxw=t.dataset.w2;document.querySelectorAll("#why .chip").forEach(c=>c.classList.toggle("on",c===t))}
  else if(t.id==="cxgo")doCancel();
  else if(t.id==="cxkeep")closeSheet();
  else if(t.id==="scan"){const s=t.querySelector("span");s.textContent="Scanning…";setTimeout(()=>{s.textContent="Scan a QR code";ok?tab("svc"):codeSheet()},900)}
  else if(t.dataset.o){t.classList.toggle("on");const o=t.dataset.o;pick=pick.includes(o)?pick.filter(x=>x!==o):[...pick,o]}
  else if(t.dataset.w!==undefined){tm=+t.dataset.w;document.querySelectorAll("#when .chip").forEach(c=>c.classList.toggle("on",c===t))}
});
renderTrack();renderHist();
setInterval(()=>{const r=reqs.find(x=>x.step<3);if(r){r.step++;renderTrack();renderHist()}},4500);
</script>
</body>
</html>
